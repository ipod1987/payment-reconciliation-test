server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: payment-reconciliation
  datasource:
    url: jdbc:postgresql://localhost:5435/payments
    username: ${DB_USERNAME:reconciliation_user}
    password: ${DB_PASSWORD:reconciliation_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JSON/REST External Payment Processor
payment-processor:
  base-url: ${PROCESSOR_BASE_URL:http://localhost:9091}
  timeout-ms: 5000
  auth:
    url: /auth/token
    username: ${PROCESSOR_USERNAME:reconciliation-service}
    password: ${PROCESSOR_PASSWORD:secret-2024}
    channel: ${PROCESSOR_CHANNEL:API}

# SOAP External Payment Processor (legacy XML)
soap-processor:
  base-url: ${SOAP_PROCESSOR_URL:http://localhost:9092}
  api-key: ${SOAP_API_KEY:soap-api-key-dev-2024}
  timeout-ms: 5000

# JWT — stateless API security
security:
  jwt:
    secret: ${JWT_SECRET:dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItcGF5bWVudC1yZWNvbmNpbGlhdGlvbi0yMDI0}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      paymentProcessor:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      soapProcessor:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
  retry:
    instances:
      paymentProcessor:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
      soapProcessor:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: Payment Reconciliation API
    description: API para conciliación de pagos entre sistema interno, procesador JSON y procesador SOAP
    version: 2.0.0

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.fintech.reconciliation: INFO
